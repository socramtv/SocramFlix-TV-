<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SocramFlix+ Pro</title>
    
    <meta name="theme-color" content="#E50914">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SocramFlix+">
    <link rel="apple-touch-icon" href="logos/icon-192.png">
    <link id="pwa-manifest" rel="manifest" href="">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.js"></script>
    <style>
        :root { --accent: #E50914; --accent2: #f5c518; --bg-deep: #0a0a0a; --bg-card: #141414; --bg-panel: #1a1a1a; --bg-hover: #222; --border: #2a2a2a; --text: #e8e8e8; --text-dim: #888; --green: #4CAF50; --gold: #f5c518; --radius: 8px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', -apple-system, sans-serif; background: var(--bg-deep); color: var(--text); min-height: 100vh; overflow-x: hidden; overscroll-behavior-y: none; }
        #app-header { background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, transparent 100%); position: absolute; top: 0; left: 0; right: 0; z-index: 200; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
        .header-logo { font-size: 1.5rem; font-weight: 900; letter-spacing: -1px; color: var(--accent); font-style: italic; text-shadow: 0 0 20px rgba(229,9,20,0.5); }
        .header-logo span { color: #fff; }
        #player-section { background: #000; width: 100%; position: sticky; top: 0; z-index: 100; display: flex; justify-content: center; }
        .video-container { width: 100%; max-width: 1000px; position: relative; aspect-ratio: 16 / 9; background: #000; overflow: hidden; cursor: default; }
        .video-container.show-controls::before { opacity: 1; }
        video { width: 100%; height: 100%; display: block; }
        .video-idle-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: radial-gradient(ellipse at center, rgba(229,9,20,0.08) 0%, rgba(0,0,0,0.9) 70%); z-index: 2; transition: opacity 0.4s; }
        .video-idle-overlay.hidden { opacity: 0; pointer-events: none; }
        .idle-logo { font-size: 3rem; font-weight: 900; font-style: italic; color: var(--accent); letter-spacing: -2px; text-shadow: 0 0 40px rgba(229,9,20,0.6); }
        .custom-controls { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 70%, transparent 100%); display: flex; flex-direction: column; gap: 6px; padding: 30px 16px 12px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 10; }
        .video-container.show-controls .custom-controls { opacity: 1; pointer-events: auto; }
        .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .control-btn { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; padding: 6px; transition: transform 0.15s, color 0.2s; border-radius: 50%; }
        .control-btn:hover { color: var(--accent); transform: scale(1.2); }
        .navigation-tabs { display: grid; grid-template-columns: repeat(6, 1fr); max-width: 1000px; margin: 0 auto; background: var(--bg-card); border-bottom: 2px solid var(--border); }
        .tab-button { background: transparent; color: var(--text-dim); border: none; border-bottom: 3px solid transparent; padding: 14px 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .tab-button.active { color: #fff; border-bottom-color: var(--accent); }
        #content-section { max-width: 1000px; margin: 0 auto; padding: 16px 14px 30px; width: 100%; }
        #epg-container { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
        .epg-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border); }
        #epg-info { padding: 12px 14px; font-size: 0.92rem; color: #ccc; }
        .channel-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 8px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .channel-card:hover { background: var(--bg-hover); transform: translateY(-2px); }
        .channel-card img { width: 50px; height: 50px; object-fit: contain; background: #fff; border-radius: 6px; }
        .floating-install-btn { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: #fff; border-radius: 50px; padding: 12px 20px; font-weight: bold; cursor: pointer; z-index: 9999; display: none; }
    </style>
</head>
<body class="body-tv-mode" id="main-body" onclick="closeSettingsMenu()">

    <div id="player-section">
        <div class="video-container show-controls" id="video-wrapper">
            <div id="app-header"><div class="header-logo">SOCRAM<span>FLIX</span>+</div></div>
            <div class="video-idle-overlay" id="idle-overlay">
                <div class="idle-logo">SOCRAM<span>FLIX</span>+</div>
                <div class="idle-sub">PRO · Selecciona un canal</div>
            </div>
            <video id="video" preload="auto" onclick="togglePlay(event)"></video>
            <div class="custom-controls" id="custom-controls-layer" onclick="event.stopPropagation()">
                <div class="controls-row">
                    <div class="controls-left">
                        <button class="control-btn" id="play-pause-btn" onclick="togglePlay(event)">▶</button>
                        <button class="control-btn" id="mute-btn" onclick="toggleMute(event)">🔊</button>
                    </div>
                    <div class="controls-right">
                        <button class="control-btn" onclick="toggleFullscreen(event)">🔲</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="navigation-tabs">
        <button id="tab-tv" class="tab-button active" onclick="changeSection('tv')">📺 TV</button>
        <button id="tab-tvplus" class="tab-button" onclick="changeSection('tvplus')">📡 TV+</button>
        <button id="tab-premium" class="tab-button" onclick="changeSection('premium')">💎 Premium</button>
        <button id="tab-runtime" class="tab-button" onclick="changeSection('runtime')">🎬 Runtime</button>
        <button id="tab-rakuten" class="tab-button" onclick="changeSection('rakuten')">🌟 Rakuten</button>
        <button id="tab-movies" class="tab-button" onclick="changeSection('movies')">🍿 Cine</button>
    </div>

    <div id="content-section">
        <div id="epg-container">
            <div class="epg-header"><div class="epg-dot"></div><span class="epg-label">Ahora</span></div>
            <div id="epg-info">Selecciona un canal para comenzar.</div>
        </div>
        <div id="channel-grid"></div>
    </div>

    <button id="install-pwa-btn" class="floating-install-btn">⬇️ Instalar App</button>

    <script>
        const VERSION_APP = "1.0.4";
        console.log("SocramFlix+ Versión: " + VERSION_APP);

        // [CONFIGURACIÓN PWA]
        const manifestJSON = { "name": "SocramFlix+ Pro " + VERSION_APP, "short_name": "SocramFlix+", "start_url": ".", "display": "standalone", "background_color": "#0a0a0a", "theme_color": "#E50914", "icons": [{ "src": "logos/icon-192.png", "sizes": "192x192", "type": "image/png" }] };
        document.getElementById('pwa-manifest').href = URL.createObjectURL(new Blob([JSON.stringify(manifestJSON)], {type: 'application/json'}));

        // [FUNCIONALIDAD]
        async function changeSection(section) {
            if (section === 'premium') {
                if (localStorage.getItem('premium_unlocked') !== 'true') {
                    const password = prompt("🔐 Introduce la contraseña:");
                    if (password !== "7788") { alert("❌ Incorrecta."); return; }
                    localStorage.setItem('premium_unlocked', 'true');
                }
            }

            ['tv','tvplus','premium','runtime','rakuten','movies'].forEach(s => document.getElementById('tab-' + s).classList.toggle('active', s === section));
            
            // Lógica de carga simplificada...
            console.log(`Versión ${VERSION_APP} - Cargando: ${section}`);
            
            // ... (restos de lógica, listeners y renderizado igual que en versiones anteriores) ...
            // Nota: Para que el código sea funcional, asegúrate de mantener tus funciones de carga (loadM3U, etc.)
        }

        // [INICIALIZACIÓN]
        window.onload = () => {
            console.log("SocramFlix+ iniciado");
        };
    </script>
</body>
</html>
